# Replace IMAGE_URI and RUNTIME_ARN before kubectl apply (see docs/deployment.md).
apiVersion: apps/v1
kind: Deployment
metadata: {name: orion-bridge, namespace: mmrf-synthetic}
spec:
  replicas: 1
  selector: {matchLabels: {app: orion-bridge}}
  template:
    metadata: {labels: {app: orion-bridge, app.kubernetes.io/instance: mmrf-synthetic}}
    spec:
      serviceAccountName: orion-bridge
      containers:
        - name: orion
          image: IMAGE_URI
          ports: [{containerPort: 8080}]
          env:
            - {name: AWS_REGION, value: us-east-1}
            - {name: ORION_RUNTIME_ARN, value: RUNTIME_ARN}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          readinessProbe: {httpGet: {path: /ping, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: orion-bridge, namespace: mmrf-synthetic}
spec:
  selector: {app: orion-bridge}
  ports: [{port: 8080, targetPort: 8080}]
---
# The internal ALB targets this private NodePort; no public load balancer is added.
apiVersion: v1
kind: Service
metadata: {name: orion-tools, namespace: mmrf-synthetic}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: identity}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30081}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: orion-tools-from-vpc, namespace: mmrf-synthetic}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: identity}}
  policyTypes: [Ingress]
  ingress:
    # NodePort source NAT can use a node address; SG restricts ingress to the internal ALB.
    - from: [{ipBlock: {cidr: VPC_CIDR}}]
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: orion-bridge-network, namespace: mmrf-synthetic}
spec:
  podSelector: {matchLabels: {app: orion-bridge}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: frontend}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{ipBlock: {cidr: '0.0.0.0/0'}}]
      ports: [{protocol: TCP, port: 443}]
