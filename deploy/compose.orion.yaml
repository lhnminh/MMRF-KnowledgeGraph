# Run with the sandbox Compose file FIRST; paths are relative to the sandbox.
services:
  orion:
    build:
      context: ${ORION_ROOT:?Set ORION_ROOT to this repository's absolute path}
    environment:
      ORION_AGENT_MODE: ${ORION_AGENT_MODE:-rehearsal}
      ORION_GRAPH_BACKEND: ${ORION_GRAPH_BACKEND:-local}
      VIRTUAL_LAB_URL: http://identity:8080
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-amazon.nova-pro-v1:0}
      NEPTUNE_ENDPOINT: ${NEPTUNE_ENDPOINT:-}
      ORION_INTERNAL_TOKEN: ${ORION_INTERNAL_TOKEN:-}
    depends_on:
      identity: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  frontend:
    depends_on:
      orion: {condition: service_healthy}
    environment:
      ORION_SERVER_URL: http://orion:8080/invocations
      ORION_INTERNAL_TOKEN: ${ORION_INTERNAL_TOKEN:-}
